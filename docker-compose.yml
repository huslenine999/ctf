services:
  movipay-roaming:
    platform: linux/amd64
    build: ./movipay/4/challenge
    environment:
      HOST: 0.0.0.0
      PORT: "31336"
      FLAG: VeriTransit{r0am1ng_1d3nt1ty_n0t_r3b0und_t0_s3ss10n}
    ports:
      - "31336:31336"
    pids_limit: 256
    mem_limit: 128m
    restart: unless-stopped

  stock-engine-race:
    platform: linux/amd64
    build: ./vulnerability/race-withdrawal/2/challenge
    environment:
      FLAG: VeriTransit{check_then_debit_is_not_a_transaction}
      PORT: "31337"
    ports:
      - "31337:31337"
    pids_limit: 256
    mem_limit: 128m
    restart: unless-stopped

  hanbit-bank-uaf:
    platform: linux/amd64
    build: ./vulnerability/bank-uaf/3/challenge
    environment:
      FLAG: VeriTransit{dangling_merge_records_reused_by_admin_review}
      PORT: "31338"
    ports:
      - "31338:31338"
    pids_limit: 256
    mem_limit: 128m
    restart: unless-stopped
